<!doctype html>
<html lang="pl">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0f1115" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Lifelog" />
    <title>Lifelog</title>
    <link rel="manifest" href="/manifest.json" />
    <link rel="apple-touch-icon" href="/icons/ikona-180.png" />
    <link rel="icon" href="/icons/ikona-192.png" />
    <link rel="stylesheet" href="/style.css" />
  </head>
  <body>
    <div id="logowanie" hidden>
      <form id="formularz-logowania">
        <!-- Logo w tym samym języku co ikony aplikacji: linia tętna rysowana
             wprost w SVG, kolory z palety (akcent na ciemnym tle). -->
        <div class="marka">
          <svg class="logo" viewBox="0 0 64 64" aria-hidden="true">
            <defs>
              <linearGradient id="logo-tlo" x1="0" y1="0" x2="1" y2="1">
                <stop offset="0" stop-color="#95e6b9" />
                <stop offset="1" stop-color="#4f9c74" />
              </linearGradient>
            </defs>
            <rect x="2" y="2" width="60" height="60" rx="17" fill="url(#logo-tlo)" />
            <path
              d="M12 36h9l5-15 9.5 24 5-15.5H52"
              fill="none"
              stroke="#0f1115"
              stroke-width="4.5"
              stroke-linecap="round"
              stroke-linejoin="round"
            />
          </svg>
          <h1>Lifelog</h1>
          <p>Dziennik diety i treningów.</p>
        </div>
        <label for="login">Login</label>
        <input
          id="login"
          name="login"
          type="text"
          autocomplete="username"
          autocapitalize="none"
          autocorrect="off"
          spellcheck="false"
          required
        />
        <label for="haslo">Hasło</label>
        <input
          id="haslo"
          name="haslo"
          type="password"
          autocomplete="current-password"
          autocapitalize="none"
          autocorrect="off"
          spellcheck="false"
          required
        />
        <!-- Błąd pokazujemy tutaj, a nie komunikatem na dole ekranu:
             na telefonie dół zasłania klawiatura i wyglądałoby to tak,
             jakby przycisk nie działał. -->
        <p id="blad-logowania" class="blad-formularza" hidden></p>
        <div class="przyciski">
          <button class="przycisk glowny" type="submit" id="przycisk-zaloguj">Zaloguj</button>
        </div>
        <p class="przelacznik-formularza">
          Masz kod od gospodarza?
          <button type="button" class="odnosnik" id="pokaz-rejestracje">Załóż konto</button>
        </p>
      </form>

      <!-- Rejestracja za wspólnym hasłem bramy. Ten sam ekran co logowanie,
           przełączany bez przeładowania — kod z linku zaproszenia
           (/?kod=...) trafia tu sam. -->
      <form id="formularz-rejestracji" hidden>
        <h2>Nowe konto</h2>
        <label for="rejestracja-kod">Kod dostępu</label>
        <input
          id="rejestracja-kod"
          name="kod"
          type="text"
          autocomplete="off"
          autocapitalize="none"
          autocorrect="off"
          spellcheck="false"
          required
        />
        <label for="rejestracja-login">Login</label>
        <input
          id="rejestracja-login"
          name="login"
          type="text"
          autocomplete="username"
          autocapitalize="none"
          autocorrect="off"
          spellcheck="false"
          required
        />
        <label for="rejestracja-haslo">Hasło (co najmniej 10 znaków)</label>
        <input
          id="rejestracja-haslo"
          name="haslo"
          type="password"
          autocomplete="new-password"
          minlength="10"
          required
        />
        <label class="zgoda">
          <input id="rejestracja-zgoda" name="zgoda" type="checkbox" required />
          <span>
            Zgadzam się na przetwarzanie moich danych o diecie, treningach
            i wadze — <a href="/polityka.html" target="_blank" rel="noopener">jak to działa</a>.
          </span>
        </label>
        <p id="blad-rejestracji" class="blad-formularza" hidden></p>
        <div class="przyciski">
          <button class="przycisk glowny" type="submit" id="przycisk-rejestruj">Załóż konto</button>
        </div>
        <p class="przelacznik-formularza">
          Masz już konto?
          <button type="button" class="odnosnik" id="pokaz-logowanie">Zaloguj się</button>
        </p>
      </form>
    </div>

    <div id="aplikacja" hidden>
      <header>
        <button id="przycisk-menu" aria-label="Menu" aria-expanded="false" aria-controls="menu">
          <span aria-hidden="true">☰</span>
        </button>
        <h1 id="tytul-ekranu">Dziś</h1>
        <span class="data" id="data-ekranu"></span>
        <!-- Bez zasięgu zapisy nie znikają, tylko czekają w kolejce.
             Użytkownik musi to widzieć, inaczej wpisze serię drugi raz. -->
        <span id="stan-sieci" hidden></span>
      </header>

      <main id="widok"></main>

      <!-- Timer stoi poza #widok celowo: odswiez() podmienia całą zawartość
           widoku, więc odliczanie umieszczone w środku ginęłoby przy każdym
           zapisanej serii — czyli dokładnie wtedy, kiedy jest potrzebne. -->
      <div id="timer" hidden>
        <span class="odliczanie" id="timer-czas" aria-live="polite">0:00</span>
        <div class="wybor">
          <button data-przerwa="90">90</button>
          <button data-przerwa="120">120</button>
          <button data-przerwa="180">180</button>
        </div>
        <button id="timer-zamknij" aria-label="Zamknij timer">✕</button>
      </div>

      <!-- Szuflada na to, co nie mieści się w dolnym pasku. Pasek zostaje przy
           trzech ekranach używanych codziennie, żeby kciuk trafiał bez patrzenia. -->
      <!-- Grupy zamiast płaskiej listy: dieta, ruch i raporty to jedna dziedzina,
           notatki zupełnie inna. Nagłówek „Menu" nie jest potrzebny — panel jest
           oczywisty z kontekstu, a etykiety grup niosą więcej. Stąd aria-label,
           żeby szuflada nie została bez nazwy dla czytnika ekranu. -->
      <div id="menu" hidden>
        <aside aria-label="Menu">
          <h2>Zdrowie</h2>
          <button data-ekran="dieta">
            <svg class="znak" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                 stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M4.5 12.5h15" />
              <path d="M5.5 12.5a6.5 6.5 0 0 0 13 0" />
              <path d="M12 12.5V9a3 3 0 0 1 3-3h1" />
            </svg>
            Dieta
          </button>
          <button data-ekran="aktywnosci">
            <svg class="znak" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                 stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <circle cx="6" cy="16.5" r="3.5" />
              <circle cx="18" cy="16.5" r="3.5" />
              <path d="M6 16.5 10.5 9h4.5l3 7.5" />
              <path d="M9 9h3.5" />
            </svg>
            Aktywności
          </button>
          <button data-ekran="plany">
            <svg class="znak" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                 stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M15.5 4.5H17A2.5 2.5 0 0 1 19.5 7v11a2.5 2.5 0 0 1-2.5 2.5H7A2.5 2.5 0 0 1 4.5 18V7A2.5 2.5 0 0 1 7 4.5h1.5" />
              <rect x="8.5" y="3" width="7" height="3.5" rx="1.2" />
              <path d="M8.5 11.5h7M8.5 15.5h4.5" />
            </svg>
            Plany treningowe
          </button>
          <button data-ekran="raporty">
            <svg class="znak" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                 stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M13.5 3.5H7a2 2 0 0 0-2 2v13a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V9z" />
              <path d="M13.5 3.5V9H19" />
              <path d="M8.5 13.5h7M8.5 17h4.5" />
            </svg>
            Raporty
          </button>

          <h2>Życie</h2>
          <button data-ekran="notatki">
            <svg class="znak" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                 stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M7.5 4h9A1.5 1.5 0 0 1 18 5.5v13a1.5 1.5 0 0 1-1.5 1.5h-9" />
              <path d="M7.5 4A1.5 1.5 0 0 0 6 5.5v13A1.5 1.5 0 0 0 7.5 20" />
              <path d="M10 8.5h5M10 12h5M10 15.5h3" />
            </svg>
            Notatki
          </button>

          <button class="na-dole" data-akcja="wyloguj">
            <svg class="znak" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                 stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M9.5 4.5H7a2 2 0 0 0-2 2v11a2 2 0 0 0 2 2h2.5" />
              <path d="M15.5 8.5 19 12l-3.5 3.5M19 12H9.5" />
            </svg>
            Wyloguj
          </button>
        </aside>
      </div>

      <!-- Ikony rysowane wprost w SVG, jak wykresy: currentColor przejmuje
           kolor aktywnej zakładki, a kreska 1.8 czyta się przy 22 px. -->
      <nav>
        <button data-ekran="dzis" aria-current="page">
          <svg class="znak" viewBox="0 0 24 24" fill="none" stroke="currentColor"
               stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <rect x="4" y="5.5" width="16" height="15" rx="2.5" />
            <path d="M8.5 3.5v3.5M15.5 3.5v3.5M4 10.5h16" />
            <circle cx="12" cy="15.5" r="1.6" fill="currentColor" stroke="none" />
          </svg>
          Dziś
        </button>
        <button data-ekran="trening">
          <svg class="znak" viewBox="0 0 24 24" fill="none" stroke="currentColor"
               stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M7 7.5v9M4 9.5v5M17 7.5v9M20 9.5v5M7 12h10" />
          </svg>
          Trening
        </button>
        <button data-ekran="postepy">
          <svg class="znak" viewBox="0 0 24 24" fill="none" stroke="currentColor"
               stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M4 16.5l5-5 3.5 3.5 7.5-7.5" />
            <path d="M15.5 7.5H20V12" />
          </svg>
          Postępy
        </button>
      </nav>
    </div>

    <script src="/app.js" type="module"></script>
  </body>
</html>
