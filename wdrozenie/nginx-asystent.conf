# Reverse proxy dla asystenta. Podmieniane przy instalacji: DOMENA_TUTAJ.
#
# Token konektora MCP jest częścią ścieżki URL, a nginx domyślnie zapisuje
# pełne ścieżki do access.log. Bez poniższego maskowania sekret dostępu do
# danych zdrowotnych lądowałby czystym tekstem w pliku logu — i w jego
# kopiach, i w archiwach logrotate.

map $request_uri $uri_do_logu {
    ~^/mcp/    "/mcp/[token-ukryty]";
    default    $request_uri;
}

log_format zamaskowany '$remote_addr - $remote_user [$time_local] '
                       '"$request_method $uri_do_logu $server_protocol" '
                       '$status $body_bytes_sent "$http_referer" "$http_user_agent" '
                       'czas=$request_time';

# --- HTTP: tylko weryfikacja certyfikatu i przekierowanie ------------------
server {
    listen 80;
    listen [::]:80;
    server_name DOMENA_TUTAJ;

    access_log /var/log/nginx/asystent-dostep.log zamaskowany;
    error_log  /var/log/nginx/asystent-blad.log;

    # Musi zostać na stałe: Let's Encrypt odnawia certyfikat co 60 dni
    # i za każdym razem sprawdza tę ścieżkę po zwykłym HTTP.
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# --- HTTPS ----------------------------------------------------------------
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name DOMENA_TUTAJ;

    ssl_certificate     /etc/letsencrypt/live/DOMENA_TUTAJ/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/DOMENA_TUTAJ/privkey.pem;

    # Ustawienia TLS wpisane wprost, zamiast dołączania
    # /etc/letsencrypt/options-ssl-nginx.conf — ten plik tworzy wyłącznie
    # wtyczka certbota --nginx, a my pobieramy certyfikat przez --webroot.
    # Przy okazji konfiguracja jest samowystarczalna i nie zależy od tego,
    # co certbot trzyma u siebie.
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;
    # Wyłącznie wymiana kluczy ECDHE, więc parametry Diffiego-Hellmana
    # (ssl_dhparam) są zbędne.

    access_log /var/log/nginx/asystent-dostep.log zamaskowany;
    error_log  /var/log/nginx/asystent-blad.log;

    # Aplikacja przyjmuje krótkie wpisy tekstowe; nie ma powodu akceptować
    # dużych żądań, a mniejszy limit ogranicza pole do nadużyć.
    client_max_body_size 1m;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 512;

    # Ikony i inne pliki niezmienne w praktyce — można trzymać długo.
    location ~* \.(png|ico|woff2?)$ {
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
        add_header Cache-Control "public, max-age=2592000";
    }

    # Powłoka aplikacji MUSI być odświeżana. Bez jawnego Cache-Control
    # przeglądarki stosują własne heurystyki i potrafią tygodniami serwować
    # starą wersję — poprawka wgrana na serwer nigdy nie dociera do telefonu.
    # "no-cache" nie znaczy "nie zapisuj", tylko "zapytaj, czy się zmieniło";
    # przy niezmienionym pliku serwer odpowiada 304 i nic się nie pobiera.
    location ~* \.(html|js|css|json|webmanifest)$ {
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
        add_header Cache-Control "no-cache";
    }

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Odpowiedzi narzędzi MCP potrafią chwilę potrwać przy zapytaniach
        # o historię; domyślne 60 s jest wystarczające, ale ustawiamy jawnie.
        proxy_read_timeout 60s;
        proxy_connect_timeout 10s;
    }
}
